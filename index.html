aside{width:210px;background:#1d1b1f;color:#d7d7da;padding:14px 12px;flex:none}

aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:9px 12px;border-radius:5px;margin-bottom:4px;cursor:pointer}
aside button.on{background:var(--rd);color:#fff;font-weight:600}aside button:hover:not(.on){background:#2b292f}
.mn{flex:1;min-width:0}
.tb{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--ln)}
.pl{width:26px;height:26px;border-radius:50%;background:var(--rd);color:#fff;border:0;font-size:18px;line-height:1;cursor:pointer}
.tb input{flex:1;max-width:380px;border:1px solid var(--ln);border-radius:16px;padding:6px 14px;font:inherit;background:#f6f7f9}
.tb span{margin-left:auto;font-size:16px}
section{padding:18px 20px}h1{font-size:19px;font-weight:500;margin:0 0 12px}h2{font-size:12px;font-weight:600;letter-spacing:.3px;margin:0 0 12px}
.top{background:#eef3fa;margin:-18px -20px 18px;padding:18px 20px;display:grid;grid-template-columns:2fr 1fr;gap:20px}
.cs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.c{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:14px 8px;text-align:center}
.c b{display:block;font-size:26px;font-weight:400}.c small{color:var(--mu);font-size:11px}.c em{display:block;font-style:normal;font-size:11px;color:#444;margin-top:8px;border-top:1px solid var(--ln);padding-top:8px}
.bl{color:var(--bl)}.rd{color:var(--rd)}.gr{color:var(--gr)}
.sm{background:#fff;border:1px solid var(--ln);border-radius:6px}.sm div{display:flex;justify-content:space-between;padding:14px 16px;font-size:12px;color:var(--mu)}.sm div+div{border-top:1px solid var(--ln)}.sm b{color:var(--tx);font-size:18px;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.cd{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:16px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.pd p{margin:0;padding:6px 0;display:flex;justify-content:space-between}
.ts{display:flex;gap:10px}.ts div{flex:1;text-align:center;border:1px solid var(--ln);border-radius:6px;padding:12px 6px}.ts i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border-radius:10px;color:#fff;font-style:normal;font-weight:700;font-size:20px}.ts b{display:block;font-size:20px}.ts small{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{font-size:12px;color:var(--mu);font-weight:600}.n{text-align:right}
.b{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.In{background:#dcf5e6;color:#17703f}.Low{background:#fdeccb;color:#935c05}.Out,.Chk{background:#fde0e0;color:#b02a2f}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:#fff}.row input{flex:1;min-width:160px}
.btn{background:var(--rd);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.msg{margin-top:8px;font-weight:600;min-height:20px}.note{color:var(--mu);font-size:12px}
@media(max-width:820px){aside{width:62px}aside button{font-size:0;padding:0;height:34px}aside button::first-letter{font-size:14px}.lg span{display:none}.top,.g,.pd{grid-template-columns:1fr}.cs{grid-template-columns:1fr 1fr}}

return `<div class="top"><div><h1>Dispatch Activity</h1><div class="cs">${card(N(sum(TR,t=>t[1])),"Units","bl","INWARD · 14 DAYS")+card(N(1187),"Units","rd","DISPATCHED · 7 DAYS")+card(N(RET),"Units","gr","RETURNS · 14 DAYS")+card(N(9881),"Units","bl","DISPATCHED · MONTH")}</div></div>
