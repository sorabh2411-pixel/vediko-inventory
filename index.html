<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vediko Inventory</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f1;--sf:#fff;--tx:#14201d;--mu:#5b6b67;--ln:#d5dedb;--ac:#0f6b5c;--ok:#1b7a43;--wa:#a8670a;--er:#b3261e;--okb:#dff3e6;--wab:#fbecd0;--erb:#f9dcda}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101716;--sf:#18221f;--tx:#e6efec;--mu:#97a9a4;--ln:#2a3a36;--ac:#4cc3ae;--ok:#6fd19a;--wa:#f0b255;--er:#ff8b82;--okb:#173a28;--wab:#3d2d0f;--erb:#40201d}}
:root[data-theme="dark"]{--bg:#101716;--sf:#18221f;--tx:#e6efec;--mu:#97a9a4;--ln:#2a3a36;--ac:#4cc3ae;--ok:#6fd19a;--wa:#f0b255;--er:#ff8b82;--okb:#173a28;--wab:#3d2d0f;--erb:#40201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 18px}header h1{margin:0;font-size:19px;font-weight:650}header p{margin:2px 0 0;font-size:13px;opacity:.85}
nav{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto}nav button{border:0;background:none;color:var(--mu);padding:8px 14px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac)}nav button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:14px;max-width:1100px;margin:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px}.k b{display:block;font-size:26px;line-height:1.1}.k span{font-size:13px;color:var(--mu)}
.k.er b{color:var(--er)}.k.wa b{color:var(--wa)}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px}.cd h2{margin:0 0 10px;font-size:16px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.In{background:var(--okb);color:var(--ok)}.Low{background:var(--wab);color:var(--wa)}.Out,.Chk{background:var(--erb);color:var(--er)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.row input{flex:1;min-width:160px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.g2{grid-template-columns:1fr}}
.msg{color:var(--ok);font-weight:600;margin-top:8px;min-height:22px}.note{color:var(--mu);font-size:13px}
svg text{fill:var(--mu);font-size:11px}
</style></head><body>
<header><h1>Vediko Origins · Inventory</h1><p id="dt"></p></header>
<nav id="nav"></nav><main id="app"></main>
<script>
// Data copied from the Vediko Inventory Dashboard sheet (demo data)
const F=[["VOMFH700","Multi Floral Honey 700g","Honey",9,0,0,0,0,5,0],["VOCOJ500","Coconut Oil 500ml Jar","Oil",3,0,2,0,0,1,0],["VOWAL100","Walnut Oil 100ml","Oil",7,0,0,0,0,5,0],["VOGCG250","A2 Desi Cow Ghee 250ml Glass","Ghee",2,2,2,0,0,5,1],["VOTH700","Tulsi Honey 700g","Honey",1,0,0,0,0,5,0],["VOCOJ1LTR","Coconut Oil 1L Jar","Oil",0,0,0,0,0,2,0],["VOGUL700","Rose Gulkand 700g","Gulkand",91,0,0,0,0,30,0],["VOSES5L","White Sesame Oil 5L Can","Oil",0,0,0,0,0,0,0],["VORMP","Raw Mango Pickle","Pickle",0,0,0,0,0,10,0],["VOCO5L","Coconut Oil 5L Can","Oil",0,0,0,0,0,1,0],["VOLP","Lemon Pickle","Pickle",0,0,0,0,0,120,0],["VOAOVO1L","Extra Virgin Avocado Oil 1L","Oil",0,0,0,0,0,0,0],["VOOP5L","Olive Pomace Oil 5L","Oil",0,0,0,0,0,0,0],["VOSES2L","Cold-Pressed Sesame Oil 2L","Oil",2752,172,1760,5,0,200,17],["VOOP1L","Olive Pomace Oil 1L","Oil",0,0,0,0,0,0,0],["VOGCP","Green Chilly Pickle","Pickle",0,0,0,0,0,120,0],["VOCO500","Coconut Oil 500ml","Oil",0,43,1,0,0,0,0],["VOAO100","Almond Oil 100ml","Oil",13,0,3,0,0,5,1],["VODCGBM","1L Jar + 2L Black Mustard Oil Free","Oil",0,0,0,0,0,120,0],["VOSES1L","White Sesame Oil 1L","Oil",26,0,7,1,0,10,0],["VOGN1L","Groundnut Oil 1L","Oil",35,33,40,1,0,30,9],["VOGCG2.5LTR-SC","A2 Gir Ghee 2.5L","Ghee",7,0,0,7,0,120,0],["VOGCG500-SC","A2 Gir Ghee 500ml SS Jar","Ghee",0,0,0,0,0,120,0],["VOCO250","Coconut Oil 250ml","Oil",4,0,3,1,0,2,0],["VOYM1L","Yellow Mustard Oil 1L","Oil",11,83,91,0,0,30,12],["VOPC250","Pickle Combo","Pickle",72,0,19,1,0,100,2],["VOSF10L","Sunflower Oil 10L","Oil",0,0,0,0,0,0,0],["VOGUL400","Rose Gulkand 400g","Gulkand",63,0,58,2,0,50,0],["VOYM5L","Yellow Mustard Oil 5L Can","Oil",14,0,6,0,0,10,1],["VOCO1LTR","Coconut Oil 1L","Oil",16,62,19,0,0,30,1],["VOCSO1LTR","Castor Oil 1L","Oil",1,20,9,2,0,10,2],["VOCSO250","Castor Oil 250ml","Oil",77,59,44,4,0,50,9],["VOBS100","Kalonji Oil 100ml","Oil",15,0,12,1,0,20,2],["VODHPC","Dhoop Sticks Classic","Other",17,62,24,0,0,50,7],["VOGCG5L-SC","A2 Gir Ghee 5L","Ghee",7,137,75,6,0,50,11],["VORFH500","Raw Forest Honey 500g","Honey",36,58,60,1,0,50,18],["VOBM5L","Black Mustard Oil 5L Can","Oil",3,35,31,0,0,15,4],["VODCG500","A2 Desi Cow Ghee 500ml","Ghee",1,324,254,0,0,50,4],["VODCG2.5LTR-SC","A2 Desi Ghee 2.5L","Ghee",45,381,232,6,0,50,3],["VOSF5L","Sunflower Oil 5L","Oil",35,225,226,3,0,50,47],["VOTH350","Raw Tulsi Honey 350g","Honey",0,0,0,0,0,50,0],["VOMFH1000","Raw Multi Floral Honey 1kg","Honey",312,0,30,1,0,50,2],["VOBMSF2L","Black Mustard + Sunflower 2L Combo","Oil",0,0,0,0,0,50,0],["VOMFH500","Raw Multi Floral Honey 500g","Honey",68,187,121,2,0,50,16],["VOGCG500","A2 Gir Ghee 500ml","Ghee",0,291,208,46,0,50,18],["VOSF2L","Sunflower Oil 2L","Oil",317,288,174,4,0,50,62],["VOTH500","Raw Tulsi Honey 500g","Honey",80,82,79,12,0,50,18],["VOCAS100","Castor Oil 100ml","Oil",66,21,64,5,0,50,7],["VOGN5LTR","Groundnut Oil 5L","Oil",90,1869,1552,7,0,50,230],["VOBM1LTR","Black Mustard Oil 1L","Oil",11,55,31,1,0,30,3],["VOBM2LTR","Black Mustard Oil 2L Pet","Oil",76,177,151,3,0,50,0],["VOGUL1000","Rose Gulkand 1kg","Gulkand",365,714,955,31,0,200,76],["VOGUL350","Rose Gulkand 350g","Gulkand",318,1251,1329,114,0,200,124],["VOEVO1L","Extra Virgin Olive Oil 1L","Oil",9,55,25,1,0,20,0],["VOGULDF350","Rose Gulkand Dry Fruit 350g","Gulkand",300,403,307,50,0,200,29],["VOCSO500","Castor Oil 500ml","Oil",2,65,32,0,0,15,7],["VOMFTH500g","Multifloral & Tulsi Honey 500g each","Honey",43,1,21,0,0,50,0],["VORFH1000","Raw Forest Honey 1kg","Honey",0,103,87,6,0,50,9],["VOGCG1000","A2 Gir Cow Ghee 1L","Ghee",149,70,295,28,0,50,18],["VODCG5L-SC","A2 Desi Ghee 5L","Ghee",98,674,819,5,0,50,121],["VOTH1000","Raw Tulsi Honey 1kg","Honey",237,300,430,9,0,50,36],["VODCG1000","A2 Desi Cow Ghee 1L","Ghee",0,2124,1345,8,0,50,153],["VOGULDF1000","Rose Gulkand Dry Fruit 1kg","Gulkand",70,225,201,30,0,200,31],["VOGCG100","A2 Gir Cow Ghee 100ml","Ghee",20,0,22,0,0,0,4],["VOAHP-500","Assorted Raw Honey Pack of 3 (1.5kg)","Honey",0,2473,2597,25,0,200,0]];
const BOX=[["100-ML-BX",684,100],["1KG-BX",697,1000],["1L-BX",1175,100],["2L-BX",50,100],["2L-GH-BX",1861,300],["350GM-BX",1645,500],["3L-BX",280,100],["500-BX",378,200],["5L-BX",1597,300],["700-BX",693,300],["AM-800-BX",0,0],["PC-250-BX",300,100],["100ML-GL-BX",-117,100],["1L-GH-BX",2621,1000],["400-BX",1102,100],["5L-DOL-IN-BX",1424,200],["5L-DOL-OUT-BX",299,200],["2.5L-IN-BX",1239,200],["2.5L-OUT-BX",1120,200],["2L-PET-BX",987,200],["1+1-PET-BX",150,200],["500GM-CB-BX",592,100],["SES2L-BOX",874,100],["500GM-3CB-BX",0,200]];
const JAR=[["100ML-GL-BTL","glass",20,2],["100ML-JR","glass",3,1],["1KG-JR","glass",114,50],["1L-GH-JR","glass",100,50],["1L-GL-BTL","glass",1,0],["350GM-JR","glass",67,20],["500GM-JR","glass",116,20],["500ML-GL-BTL","glass",15,1],["700GM-JR","glass",63,20],["1L-PET-BTL","pet",5,200],["250ML-PET-BTL","pet",407,2],["120GM-PET-JR","pet",10000,300],["250GM-PET-JR","pet",0,300],["5L-DOL","SS",716,100],["2.5L-DOL","SS",259,100],["400GM-PET-JR","pet",0,100],["5L-CAN","pet",4404,200],["1L-SS","SS",80,20],["500ML-SS","SS",100,20],["Bamboo jar 300gm","glass",23,10]];
const RAW=[["Loose Honey Tulsi","Drum",18,10],["Loose groundnut oil","Can",18,10],["Loose rose gulkand","Tin",98,20],["Loose A2 gir cow ghee","Tin",51,40],["Loose desi cow ghee","Tin",16,40],["Loose almond oil","Can",1,1],["Loose black mustard oil","Can",6,8],["Loose blackseed oil","Can",0,1],["Loose castor oil","Can",3,1],["Loose chilly pickle","Drum",1,0],["Loose coconut oil","Can",7,4],["Loose forest honey","Drum",7,4],["Loose mango pickle","Drum",1,0],["Loose multi floral honey","Drum",22,4],["Loose sesame oil","Drum",5,2],["Loose yellow mustard oil","Can",26,4],["Loose sunflower oil","Can",0,4],["Loose olive oil","Can",8,4]];
const TR=[["18",0,0],["19",393,340],["20",155,135],["21",347,139],["22",650,102],["23",213,1255],["24",483,485],["25",0,0],["26",0,609],["27",282,202],["28",596,300],["29",452,76],["30",0,0],["31",0,0]];
const CH=[["CRED",6725],["Shopify",2012],["Shipment (AMZ)",600],["Amazon",238],["Offline / B2B",76]];
// Normalise every stock type to {id,name,cur,re,s7}
const S={Finished:F.map(r=>({id:r[0],name:r[1],cat:r[2],cur:r[3]+r[4]-r[5]+r[6]-r[7],re:r[8],s7:r[9]})),
Box:BOX.map(r=>({id:r[0],name:r[0],cat:"Box",cur:r[1],re:r[2],s7:0})),
Jar:JAR.map(r=>({id:r[0],name:r[0],cat:r[1],cur:r[2],re:r[3],s7:0})),
Raw:RAW.map(r=>({id:r[0],name:r[0],cat:r[1],cur:r[2],re:r[3],s7:0}))};
const LOG=[];const N=x=>x.toLocaleString("en-IN");
const st=i=>i.cur<0?["Chk","Check entry"]:i.cur===0?["Out","Out of stock"]:i.cur<=i.re?["Low","Low stock"]:["In","In stock"];
const bd=i=>{const s=st(i);return `<span class="b ${s[0]}">${s[1]}</span>`};
const all=()=>Object.entries(S).flatMap(([t,a])=>a.map(i=>({...i,t})));
const cover=i=>i.s7>0?Math.round(i.cur/(i.s7/7)):"-";
function table(rows,cols){return `<div class="tw"><table><tr>${cols.map(c=>`<th class="${c[2]||""}">${c[0]}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[2]||""}">${c[1](r)}</td>`).join("")}</tr>`).join("")}</table></div>`}
function chart(){const W=640,H=180,m=26,mx=Math.max(...TR.map(t=>Math.max(t[1],t[2])),1),bw=(W-m)/TR.length;
let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Inward and dispatched units per day">`;
TR.forEach((t,i)=>{const x=m+i*bw,a=t[1]/mx*H,b=t[2]/mx*H;s+=`<rect x="${x+3}" y="${H-a}" width="${bw/2-4}" height="${a}" fill="var(--ac)"><title>${t[0]} Oct inward ${t[1]}</title></rect><rect x="${x+bw/2}" y="${H-b}" width="${bw/2-4}" height="${b}" fill="var(--wa)"><title>${t[0]} Oct dispatched ${t[2]}</title></rect><text x="${x+bw/2}" y="${H+13}" text-anchor="middle">${t[0]}</text>`});
return s+`<text x="0" y="10">${mx}</text></svg><p class="note"><span style="color:var(--ac)">■</span> Inward &nbsp; <span style="color:var(--wa)">■</span> Dispatched &nbsp; (units per day, October)</p>`}
const V={
dash(){const a=all(),out=a.filter(i=>i.cur===0).length,low=a.filter(i=>i.cur>0&&i.cur<=i.re).length,er=a.filter(i=>i.cur<0).length,fu=S.Finished.reduce((s,i)=>s+Math.max(i.cur,0),0);
const pr=a.filter(i=>i.cur<=i.re&&i.re>0).sort((x,y)=>(x.cur-x.re)-(y.cur-y.re)).slice(0,12),mx=CH[0][1];
return `<div class="kp"><div class="k"><b>${S.Finished.length}</b><span>Finished SKUs</span></div><div class="k"><b>${N(fu)}</b><span>Finished units in stock</span></div><div class="k er"><b>${out}</b><span>Out of stock (all sheets)</span></div><div class="k wa"><b>${low}</b><span>Low stock</span></div><div class="k er"><b>${er}</b><span>Entry errors (negative)</span></div><div class="k"><b>${N(S.Box.reduce((s,i)=>s+Math.max(i.cur,0),0))}</b><span>Boxes in stock</span></div></div>
<div class="g2"><div class="cd"><h2>Inward vs dispatched</h2>${chart()}</div><div class="cd"><h2>Dispatch by channel (30 days)</h2>${CH.map(c=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${c[0]}</span><b>${N(c[1])}</b></div><div style="height:8px;background:var(--bg);border-radius:4px"><div style="height:8px;width:${c[1]/mx*100}%;background:var(--ac);border-radius:4px"></div></div></div>`).join("")}</div></div>
<div class="cd"><h2>Reorder priorities</h2>${table(pr,[["Type",i=>i.t],["Item",i=>i.name],["In stock",i=>N(i.cur),"n"],["Reorder level",i=>i.re,"n"],["Short by",i=>Math.max(i.re-i.cur,0),"n"],["Status",bd]])}</div>`},
fin(){return `<div class="cd"><div class="row"><input id="q" placeholder="Search SKU or product" aria-label="Search"><select id="c"><option value="">All categories</option>${[...new Set(S.Finished.map(i=>i.cat))].map(c=>`<option>${c}</option>`).join("")}</select><select id="s"><option value="">All status</option><option>Chk</option><option>Out</option><option>Low</option><option>In</option></select></div><div id="ft"></div></div>`},
bj(){return `<div class="g2"><div class="cd"><h2>Boxes</h2>${table(S.Box,[["Box",i=>i.id],["Stock",i=>N(i.cur),"n"],["Reorder",i=>N(i.re),"n"],["Status",bd]])}</div><div class="cd"><h2>Jars & bottles</h2>${table(S.Jar,[["Item",i=>i.id],["Type",i=>i.cat],["Stock",i=>N(i.cur),"n"],["Reorder",i=>N(i.re),"n"],["Status",bd]])}</div></div>`},
raw(){return `<div class="cd"><h2>Raw material (loose)</h2>${table(S.Raw,[["Material",i=>i.id],["Unit",i=>i.cat],["Stock",i=>i.cur,"n"],["Reorder",i=>i.re,"n"],["Status",bd]])}</div>`},
add(){return `<div class="cd"><h2>Record a movement</h2><div class="row"><select id="t">${Object.keys(S).map(t=>`<option>${t}</option>`).join("")}</select><select id="i"></select><select id="m"></select><input id="qt" type="number" min="1" placeholder="Quantity" style="max-width:130px;flex:none"><button class="btn" id="go">Save entry</button></div><div class="msg" id="msg" role="status"></div><p class="note">Stock updates instantly on every screen. Entries live in this browser tab only (demo).</p></div><div class="cd"><h2>Entries this session</h2><div id="lg"><p class="note">No entries yet. Record one above.</p></div></div>`}};
const TABS=[["dash","Dashboard"],["fin","Finished products"],["bj","Boxes & jars"],["raw","Raw material"],["add","Add entry"]];let cur="dash";
function ftab(){const q=document.getElementById("q").value.toLowerCase(),c=document.getElementById("c").value,s=document.getElementById("s").value;
const r=S.Finished.filter(i=>(!q||(i.id+i.name).toLowerCase().includes(q))&&(!c||i.cat===c)&&(!s||st(i)[0]===s));
document.getElementById("ft").innerHTML=table(r,[["SKU",i=>i.id],["Product",i=>i.name],["Category",i=>i.cat],["Stock",i=>N(i.cur),"n"],["Reorder",i=>i.re,"n"],["Sold 7d",i=>i.s7,"n"],["Days cover",cover,"n"],["Status",bd]])+`<p class="note">${r.length} of ${S.Finished.length} SKUs</p>`}
function addInit(){const t=document.getElementById("t"),i=document.getElementById("i"),m=document.getElementById("m");
const fill=()=>{i.innerHTML=S[t.value].map(x=>`<option value="${x.id}">${x.id}${x.name!==x.id?" – "+x.name:""}</option>`).join("");m.innerHTML=(t.value==="Finished"?["Inward","Outward","Return","Damage"]:["Inward","Outward","Damage"]).map(x=>`<option>${x}</option>`).join("")};
t.onchange=fill;fill();
document.getElementById("go").onclick=()=>{const q=parseInt(document.getElementById("qt").value,10),msg=document.getElementById("msg");
if(!q||q<1){msg.style.color="var(--er)";msg.textContent="Enter a quantity of 1 or more.";return}
const it=S[t.value].find(x=>x.id===i.value),sg=(m.value==="Inward"||m.value==="Return")?1:-1;it.cur+=sg*q;
LOG.unshift({d:new Date().toLocaleTimeString(),t:t.value,id:it.id,m:m.value,q,cur:it.cur});
msg.style.color="var(--ok)";msg.textContent=`Saved: ${m.value} ${q} × ${it.id}. New stock ${N(it.cur)}.`+(it.cur<0?" Stock is now negative – check the entry.":"");
document.getElementById("qt").value="";document.getElementById("lg").innerHTML=table(LOG,[["Time",l=>l.d],["Type",l=>l.t],["Item",l=>l.id],["Movement",l=>l.m],["Qty",l=>l.q,"n"],["Stock after",l=>N(l.cur),"n"]])}}
function show(k){cur=k;document.getElementById("app").innerHTML=V[k]();
document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
if(k==="fin"){ftab();["q","c","s"].forEach(id=>document.getElementById(id).oninput=ftab)}if(k==="add")addInit()}
document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-k="${t[0]}">${t[1]}</button>`).join("");
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.k));
document.getElementById("dt").textContent="Stock report · 31 Oct 2026 · demo data from your sheet";show("dash");
</script></body></html>
